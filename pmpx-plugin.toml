# Read by pmpx when it scans the plugin directory; no dlopen is involved.
#
# `name` must equal `PackageManager::name()` -- the host refuses to load the library when they
# disagree, which is what catches a plugin directory assembled out of mismatched pieces.
[plugin]
name    = "pnpm"
version = "0.1.1"
abi     = 3
family  = "node"

# Evidence used to score this backend against a project root.
#
# `pnpm-lock.yaml` and `pnpm-workspace.yaml` are strong (100): both are pnpm's own files, so
# either one proves the tree was actually resolved by pnpm. `package.json` is weak (10): every
# Node package manager matches it, so it only proves the ecosystem. That gap is the whole point
# of the two tiers -- a tree with nothing but a `package.json` scores 10 and can lose to another
# ecosystem, which is why a pin exists.
[detect]
strong = ["pnpm-lock.yaml", "pnpm-workspace.yaml"]
weak   = ["package.json"]
